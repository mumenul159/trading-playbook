          id: `log-${Date.now()}`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),

          emotion: newLogEmotion,
          reflection: newLogText.trim()

        try {
          localStorage.setItem('trading_mindset_notes', JSON.stringify(updated));

        setNewLogText('');

                              <line x1="210" y1="15" x2="210" y2="60" stroke="#10b981" strokeWidth="2.5" /><rect x="205" y="20" width="10" height="35" fill="#10b981" />

                              {/* Warning Banner */}
                              <rect x="235" y="25" width="230" height="34" fill="#000000" rx="4" stroke="#f59e0b" strokeWidth="1" />
                              <text x="245" y="40" fill="#f59e0b" fontSize="9" fontFamily="monospace" fontWeight="bold">EXTENDED &gt; 15 PTS FROM LOW</text>
                              <text x="245" y="52" fill="#cbd5e1" fontSize="8" fontFamily="monospace">Buying here creates bad R:R stop</text>
                            </svg>
                          </div>
                        );
                      }
                      return null;
                    })()}

                    <div className="space-y-2.5">
                      {QUIZ_QUESTIONS[currentQuestionIndex].options.map((opt, idx) => {
                        const isSel = selectedOption === idx;
                        let cls = "bg-slate-950 border-slate-800 text-slate-300";
                        if (isAnswerSubmitted) {
                          if (opt.correct) cls = "bg-emerald-950/40 border-emerald-500 text-emerald-200";
                          else if (isSel && !opt.correct) cls = "bg-rose-950/40 border-rose-500 text-rose-200";
                        } else if (isSel) {
                          cls = "bg-emerald-950/20 border-emerald-500 text-white";
                        }
                        return (
                          <button
                            key={idx}
                            onClick={() => !isAnswerSubmitted && setSelectedOption(idx)}
                            className={`w-full text-left p-3 rounded-xl border text-xs font-medium transition ${cls}`}
                          >
                            {opt.text}
                          </button>
                        );
                      })}
                    </div>

                    {isAnswerSubmitted && (
                      <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300">
                        {QUIZ_QUESTIONS[currentQuestionIndex].options[selectedOption].reason}
                      </div>
                    )}

                    <div className="flex justify-end">
                      {!isAnswerSubmitted ? (
                        <button
                          onClick={handleSubmitAnswer}
                          disabled={selectedOption === null}
                          className="px-5 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs uppercase disabled:opacity-50"
                        >
                          Confirm
                        </button>
                      ) : (
                        <button
                          onClick={handleNextQuestion}
                          className="px-5 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs uppercase"
                        >
                          Next
                        </button>
                      )}
                    </div>
                  </>
                ) : (
                  <div className="text-center py-8 space-y-4">
                    <h3 className="text-2xl font-bold text-white">Quiz Completed</h3>
                    <p className="text-sm font-mono text-emerald-400">Score: {quizScore} / {QUIZ_QUESTIONS.length}</p>
                    <button onClick={handleResetQuiz} className="px-5 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs">
                      Restart Quiz
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: FLASHCARDS */}
            {activeTab === 'drills' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {RAPID_FLASHCARDS.map(card => {
                  const isFlipped = !!flippedCards[card.id];
                  return (
                    <div
                      key={card.id}
                      onClick={() => toggleCardFlip(card.id)}
                      className={`h-56 p-5 rounded-2xl border cursor-pointer flex flex-col justify-between transition ${
                        isFlipped ? 'bg-emerald-950/30 border-emerald-500 text-emerald-100' : 'bg-slate-900 border-slate-800 text-slate-300'
                      }`}
                    >
                      <div>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-emerald-400 block w-max mb-2">
                          {card.tag}
                        </span>
                        <p className="text-xs font-semibold leading-relaxed">
                          {isFlipped ? card.back : card.front}
                        </p>
                      </div>
                      <div className="text-[10px] font-mono text-slate-500 text-right">
                        {isFlipped ? 'REVEALED' : 'TAP TO FLIP'}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

          </main>

          <footer className="border-t border-slate-800 px-6 py-2 text-xs font-mono text-slate-500 text-center">
            Process First, P&L Follows • EOD Downtrend Reversal Long Core
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
